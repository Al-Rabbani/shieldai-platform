name: GDSA Radar Security Gate

on:
  pull_request:
    branches: [main, master, develop]
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  client-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: |
          python -m unittest discover -s tests -p 'test_security_gate_client.py' -v
          python -m unittest discover -s tests -p 'test_ci_gate_backend.py' -v

  security-gate:
    name: GDSA Radar Security Scan & Gate
    runs-on: ubuntu-latest
    needs: client-contracts
    outputs:
      verdict: ${{ steps.gate.outputs.verdict }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Request a validated security verdict
        id: gate
        env:
          SHIELDAI_GATE_URL: ${{ secrets.SHIELDAI_GATE_URL }}
          CI_GATE_API_KEY: ${{ secrets.CI_GATE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/security_gate_client.py gate

  # The autofix job was removed on 19 Nov 2026. It posted to SHIELDAI_AUTOFIX_URL, which no endpoint
  # serves (openapi.json has zero autofix paths), and an unattended job that commits fixes would bypass
  # the governed approval path. Fixes come from tool_gateway._auto_fix_finding as a mission plan that a
  # human approves. The gate blocks; it does not rewrite code.
