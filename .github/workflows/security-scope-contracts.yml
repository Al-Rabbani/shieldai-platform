name: Security scope offline contracts
on:
  pull_request:
    paths:
      - 'apps/api/gds_api/security_scope.py'
      - 'tests/test_security_scope.py'
      - '.github/workflows/security-scope-contracts.yml'
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_security_scope.py' -v
