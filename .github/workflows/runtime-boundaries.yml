name: GDS runtime boundary regression tests
on:
  pull_request:
    paths:
      - 'apps/api/gds_api/reasoning/**'
      - 'apps/api/gds_api/bridge/**'
      - 'apps/api/gds_api/capabilities/**'
      - 'apps/api/gds_api/tool_gateway.py'
      - 'tests/test_production_hardening.py'
      - 'tests/integration/**'
      - 'deploy/base44-hardening/**'
      - 'apps/api/gds_kernel/**'
      - 'tests/test_runtime_boundaries.py'
      - '.github/workflows/runtime-boundaries.yml'
  push:
    branches: [main]
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

  postgres-execution-claims:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gds_test
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: gds_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gds_test -d gds_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      GDS_TEST_DATABASE_URL: postgresql+asyncpg://gds_test:isolated-test-only@127.0.0.1:5432/gds_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m pip install 'SQLAlchemy[asyncio]==2.1.8' asyncpg==0.32.0
      - run: python -m unittest discover -s tests/integration -p 'test_execution_claim_postgres.py' -v

  base44-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: node deploy/base44-hardening/tests/gds-production-hardening.mjs
      - run: node deploy/base44-hardening/tests/gds-runtime-diagnostics.mjs
