name: GDS runtime boundary regression tests
on:
  pull_request:
    paths:
      - 'apps/api/gds_api/reasoning/**'
      - 'apps/api/gds_api/bridge/**'
      - 'apps/api/gds_api/capabilities/**'
      - 'apps/api/gds_api/tool_gateway.py'
      - 'tests/test_production_hardening.py'
      - 'apps/api/gds_kernel/**'
      - 'tests/test_runtime_boundaries.py'
      - '.github/workflows/runtime-boundaries.yml'
  push:
    branches: [main]
jobs:
  offline-contracts:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_*.py' -v
