# GDS OS edge rate limits. Included from /etc/nginx/nginx.conf's http block via conf.d.
#
# MEASURED 26 Nov 2026: nginx carried no limit_req anywhere (grep limit_req sites-enabled/* = 0 matches), so the only
# rate limiting in the platform was application-level, i.e. it ran after nginx had accepted the connection and the
# Python worker had parsed the request. A flood could still exhaust the workers it was meant to be limited by.
#
# Sized for a real browser session rather than a benchmark: the console fires a burst of /api/ calls on first paint, so
# gds_api allows 20/s with a 40-request burst. Credential submission is separated out and is deliberately brutal.
limit_req_zone $binary_remote_addr zone=gds_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=gds_auth:10m rate=5r/m;

# A refused request is logged, so an operator can see a flood rather than infer it from a slow site.
limit_req_log_level warn;
