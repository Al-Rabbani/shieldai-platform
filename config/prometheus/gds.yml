# Scrapes the two real metric sources on this host. Both bind loopback, so Prometheus scrapes
# 127.0.0.1 directly rather than going through any public port.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
scrape_configs:
  - job_name: gds-api
    metrics_path: /metrics/
    static_configs:
      - targets: ['127.0.0.1:8000']
  - job_name: gds-worker
    metrics_path: /metrics
    static_configs:
      - targets: ['127.0.0.1:8001']
  - job_name: prometheus
    static_configs:
      - targets: ['127.0.0.1:9090']
