<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GDS OS — Security Operations Dashboard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#0a0e1a;--surface:#111827;--surface2:#1a2235;--border:#1f2937;--primary:#3b82f6;--primary-glow:rgba(59,130,246,.3);--text:#e5e7eb;--muted:#9ca3af;--accent:#06b6d4;--danger:#ef4444;--success:#10b981;--warn:#f59e0b;--radius:12px}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.hidden{display:none!important}
.btn{padding:12px 24px;border-radius:10px;font-weight:600;font-size:15px;border:none;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:var(--primary);color:#fff}.btn-primary:hover{background:#2563eb;transform:translateY(-1px);box-shadow:0 8px 30px var(--primary-glow)}
.btn-secondary{background:var(--surface);color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{border-color:var(--muted)}
input,select{width:100%;padding:12px 16px;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);font-size:15px;outline:none;transition:border .2s}
input:focus{border-color:var(--primary)}
label{font-size:14px;color:var(--muted);margin-bottom:6px;display:block}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:24px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center}
.stat-val{font-size:32px;font-weight:800}
.stat-lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:100px;font-size:12px;font-weight:600}
.badge-green{background:rgba(16,185,129,.15);color:var(--success)}
.badge-red{background:rgba(239,68,68,.15);color:var(--danger)}
.badge-yellow{background:rgba(245,158,11,.15);color:var(--warn)}
.badge-blue{background:rgba(59,130,246,.15);color:var(--primary)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}
.dot-green{background:var(--success)}.dot-red{background:var(--danger)}.dot-yellow{background:var(--warn)}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:12px 16px;font-size:12px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);border-bottom:1px solid var(--border)}
td{padding:12px 16px;border-bottom:1px solid var(--border);font-size:14px}
tr:hover{background:var(--surface2)}
.nav{position:fixed;top:0;left:0;right:0;z-index:100;background:rgba(10,14,26,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:14px 0}
.nav-inner{max-width:1400px;margin:0 auto;padding:0 24px;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:18px;font-weight:700;color:var(--text);text-decoration:none}.logo span{color:var(--primary)}
.nav-links{display:flex;gap:24px;align-items:center}
.nav-links a{color:var(--muted);text-decoration:none;font-size:14px;transition:color .2s}.nav-links a:hover{color:var(--text)}
.nav-links a.active{color:var(--primary)}
.main{max-width:1400px;margin:0 auto;padding:80px 24px 40px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.section-title{font-size:20px;font-weight:700;margin-bottom:16px}
.mt{margin-top:24px}
.muted{color:var(--muted)}
.mb{margin-bottom:8px}
.sev-c{color:var(--danger)}.sev-h{color:#fb923c}.sev-m{color:var(--warn)}.sev-l{color:var(--success)}
.spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--primary);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.auth-card{max-width:420px;width:100%}
.auth-card h1{font-size:28px;font-weight:800;margin-bottom:8px;text-align:center}
.auth-card p{text-align:center;color:var(--muted);margin-bottom:32px}
.auth-error{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:var(--danger);padding:12px 16px;border-radius:10px;font-size:14px;margin-bottom:16px}
.auth-success{background:rgba(16,185,129,.1);border:1px solid rgba(16,185,129,.3);color:var(--success);padding:12px 16px;border-radius:10px;font-size:14px;margin-bottom:16px}
.toggle-row{display:flex;gap:8px;margin-bottom:24px}
.toggle-btn{flex:1;padding:10px;text-align:center;border-radius:8px;cursor:pointer;font-size:14px;font-weight:600;transition:all .2s;border:1px solid var(--border);background:var(--surface);color:var(--muted)}
.toggle-btn.active{background:var(--primary);color:#fff;border-color:var(--primary)}
@media(max-width:768px){.grid-4,.grid-3,.grid-2{grid-template-columns:1fr}.nav-links a:not(#nav-user){display:none}}

:focus-visible{outline:3px solid #6ee7ff;outline-offset:4px}
.toggle-btn{font:inherit;color:inherit;background:transparent;border:0;cursor:pointer}
.assurance-panel{padding:clamp(16px,3vw,32px);border:1px solid #334155;border-radius:20px;background:radial-gradient(ellipse at top right,rgba(34,211,238,.12),transparent 60%),#101827}
.assurance-heading{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.assurance-eyebrow{font-size:11px;letter-spacing:.18em;color:#67e8f9;margin-bottom:8px}
.assurance-metrics{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:24px 0}
.assurance-metrics>div{padding:16px;border:1px solid #334155;border-radius:12px;background:rgba(15,23,42,.65)}
.assurance-metrics strong{display:block;font-size:clamp(25px,4vw,38px);color:#e2e8f0}
.assurance-metrics span{display:block;font-size:12px;color:#cbd5e1;margin-top:5px}
.assurance-table{max-width:100%;overflow-x:auto;margin-top:20px}
.assurance-table table{min-width:760px}.assurance-table th{text-align:left}
.assurance-pill{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;border:1px solid currentColor}
.assurance-pill.ok{color:#6ee7b7}.assurance-pill.warn{color:#fcd34d}
.assurance-planned{margin-top:24px;color:#cbd5e1}.assurance-planned summary{cursor:pointer}
@media(max-width:768px){.nav-inner{align-items:flex-start;gap:16px;flex-wrap:wrap}.nav-links{gap:8px 16px;flex-wrap:wrap;padding-bottom:10px}.nav-links a:not(#nav-user){display:inline-block}.main{padding-left:16px;padding-right:16px}.assurance-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.auth-box{max-width:100%;box-sizing:border-box}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

</style>
</head>
<body>

<!-- LOGIN / REGISTER VIEW -->
<div id="authView" class="auth-wrap">
<div class="auth-card card">
<h1>GDS <span style="color:var(--primary)">OS</span></h1>
<p>Autonomous Security Operations Platform</p>
<div id="authError" role="alert" class="hidden auth-error"></div>
<div id="authSuccess" role="status" class="hidden auth-success"></div>
<div class="toggle-row">
<button type="button" class="toggle-btn active" id="loginToggle" onclick="switchAuth('login')">Sign In</button>
<button type="button" class="toggle-btn" id="registerToggle" onclick="switchAuth('register')">Register</button>
</div>
<form id="loginForm" onsubmit="return doLogin(event)">
<label for="email">Email</label>
<input autocomplete="username" type="email" id="email" placeholder="president@globaldigitalstreams.com" required style="margin-bottom:16px">
<label for="password">Password</label>
<input autocomplete="current-password" type="password" id="password" placeholder="Enter password" required style="margin-bottom:24px">
<button type="submit" class="btn btn-primary" style="width:100%">Sign In</button>
</form>
<form id="registerForm" class="hidden" onsubmit="return doRegister(event)">
<label for="regEmail">Email</label>
<input type="email" id="regEmail" autocomplete="email" placeholder="your@email.com" required style="margin-bottom:16px">
<label for="regPassword">Password</label>
<input type="password" id="regPassword" autocomplete="new-password" placeholder="Choose a password" required style="margin-bottom:16px">
<label for="regOrg">Organization Name</label>
<input type="text" id="regOrg" autocomplete="organization" placeholder="Your organization" required style="margin-bottom:24px">
<button type="submit" class="btn btn-primary" style="width:100%">Create Account</button>
</form>
</div>
</div>

<!-- DASHBOARD VIEW -->
<div id="dashView" class="hidden">
<nav>
<div class="nav-inner">
<a href="/" class="logo">GDS<span>OS</span></a>
<div class="nav-links">
<a href="#" onclick="showPage('overview');return false" id="nav-overview" class="active">Overview</a>
<a href="#" onclick="showPage('findings');return false" id="nav-findings">Findings</a>
<a href="#" onclick="showPage('incidents');return false" id="nav-incidents">Incidents</a>
<a href="#" onclick="showPage('cloud');return false" id="nav-cloud">Cloud</a>
<a href="#" onclick="showPage('agents');return false" id="nav-agents">Agents</a>
<a href="https://api.globaldigitalsecurity.io/docs" target="_blank">API Docs</a>
<a href="#" onclick="logout();return false" id="nav-user" style="color:var(--primary);font-weight:600"></a>
</div>
</div>
</nav>
<div class="main">

<!-- Overview Page -->
<div id="page-overview">
<div class="grid-4 mb" style="margin-bottom:24px">
<div class="stat"><div class="stat-val" id="stat-health">--</div><div class="stat-lbl">Services</div></div>
<div class="stat"><div class="stat-val" id="stat-routes">373</div><div class="stat-lbl">API Routes</div></div>
<div class="stat"><div class="stat-val" id="stat-findings">--</div><div class="stat-lbl">Findings</div></div>
<div class="stat"><div class="stat-val" id="stat-incidents">--</div><div class="stat-lbl">Incidents</div></div>
</div>
<div class="grid-2">
<div class="card">
<div class="section-title">Service Health</div>
<div id="healthList"><div class="spinner"></div></div>
</div>
<div class="card">
<div class="section-title">Platform Info</div>
<div id="platformInfo"><div class="spinner"></div></div>
</div>
</div>
<div class="card mt">
<div class="section-title">Recent Audit Events</div>
<div id="auditList"><div class="spinner"></div></div>
</div>
</div>

<!-- Findings Page -->
<div id="page-findings" class="hidden">
<div class="card">
<div class="section-title">Security Findings</div>
<div id="findingsList"><div class="spinner"></div></div>
</div>
</div>

<!-- Incidents Page -->
<div id="page-incidents" class="hidden">
<div class="card">
<div class="section-title">Active Incidents</div>
<div id="incidentsList"><div class="spinner"></div></div>
</div>
</div>

<!-- Cloud Page -->
<div id="page-cloud" class="hidden">
<div class="grid-2">
<div class="card">
<div class="section-title">Cloud Environments</div>
<div id="cloudList"><div class="spinner"></div></div>
</div>
<div class="card">
<div class="section-title">CIEM Findings</div>
<div id="ciemList"><div class="spinner"></div></div>
</div>
</div>
</div>

<!-- Agents Page -->
<div id="page-agents" class="hidden">
<div class="card">
<div class="section-title">Agent Fleet</div>
<div id="agentsList"><div class="spinner"></div></div>
</div>
</div>

</div>
</div>

<script>
const API = window.location.origin + '/api';
let currentUser = null;

// Check for stored session
window.onload = async function() {
  sessionStorage.removeItem('gds_user');
  try {
    const response = await fetch(API + '/auth/me', {credentials: 'include'});
    if (!response.ok) return;
    currentUser = await response.json();
    showDashboard();
  } catch (_) {
    showErr('Session verification is unavailable. Please try signing in.');
  }
};

function switchAuth(mode) {
    document.getElementById('loginForm').classList.toggle('hidden', mode !== 'login');
    document.getElementById('registerForm').classList.toggle('hidden', mode !== 'register');
    document.getElementById('loginToggle').classList.toggle('active', mode === 'login');
    document.getElementById('registerToggle').classList.toggle('active', mode === 'register');
    document.getElementById('authError').classList.add('hidden');
    document.getElementById('authSuccess').classList.add('hidden');
}

function showErr(msg) {
    const el = document.getElementById('authError');
    el.textContent = msg;
    el.classList.remove('hidden');
}
function showSucc(msg) {
    const el = document.getElementById('authSuccess');
    el.textContent = msg;
    el.classList.remove('hidden');
}

async function doLogin(e) {
    e.preventDefault();
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;
    try {
        const res = await fetch(API + '/auth/login', {
            method: 'POST',
            credentials: 'include',
      headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email, password})
        });
        const data = await res.json();
        if (!res.ok) {
            showErr(data.detail?.[0]?.msg || data.detail || 'Login failed');
            return false;
        }
        currentUser = data;
        sessionStorage.setItem('gds_user', JSON.stringify(data));
        showDashboard();
    } catch(err) {
        showErr('Cannot reach API server. Check your connection.');
    }
    return false;
}

async function doRegister(e) {
    e.preventDefault();
    const email = document.getElementById('regEmail').value;
    const password = document.getElementById('regPassword').value;
    try {
        const res = await fetch(API + '/auth/register', {
            method: 'POST',
            credentials: 'include',
      headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({email, password})
        });
        const data = await res.json();
        if (!res.ok) {
            showErr(data.detail?.[0]?.msg || data.detail || 'Registration failed');
            return false;
        }
        showSucc('Account created! Please sign in.');
        switchAuth('login');
        document.getElementById('email').value = email;
        document.getElementById('password').value = '';
        document.getElementById('password').focus();
    } catch(err) {
        showErr('Cannot reach API server.');
    }
    return false;
}

async function logout() {
  try {
    const response = await fetch(API + '/auth/logout', {method: 'POST', credentials: 'include'});
    if (!response.ok && response.status !== 401) throw new Error('logout');
    sessionStorage.removeItem('gds_user');
    currentUser = null;
    location.reload();
  } catch (_) {
    window.alert('Sign-out could not be confirmed by the server. Please retry.');
  }
}

function showDashboard() {
    document.getElementById('authView').classList.add('hidden');
    document.getElementById('dashView').classList.remove('hidden');
    document.getElementById('nav-user').textContent = currentUser.email.split('@')[0];
    loadOverview();
}

function showPage(page) {
    ['overview','findings','incidents','cloud','agents'].forEach(p => {
        document.getElementById('page-'+p).classList.toggle('hidden', p !== page);
        const nav = document.getElementById('nav-'+p);
        if (nav) nav.classList.toggle('active', p === page);
    });
    if (page === 'findings') loadFindings();
    if (page === 'incidents') loadIncidents();
    if (page === 'cloud') loadCloud();
    if (page === 'agents') loadAgents();
}

async function apiGet(path) {
    try {
        const res = await fetch(API + path, {credentials: 'include'});
    if (res.status === 401) {
      currentUser = null;
      sessionStorage.removeItem('gds_user');
      document.getElementById('dashView').classList.add('hidden');
      document.getElementById('authView').classList.remove('hidden');
      showErr('Your session has expired. Please sign in again.');
      return null;
    }
        if (!res.ok) return null;
        return await res.json();
    } catch { return null; }
}

async function loadOverview() {
    const health = await apiGet('/health');
    if (health && health.services) {
        let html = '<table><tr><th>Service</th><th>Status</th><th>Latency</th></tr>';
        let healthy = 0;
        for (const [name, svc] of Object.entries(health.services)) {
            const ok = svc.status === 'healthy';
            if (ok) healthy++;
            html += `<tr><td>${escapeHtml(name)}</td><td><span class="badge ${ok?'badge-green':'badge-red'}"><span class="dot ${ok?'dot-green':'dot-red'}"></span>${escapeHtml(svc.status)}</span></td><td class="muted">${(svc.latency_ms||0).toFixed(1)}ms</td></tr>`;
        }
        html += '</table>';
        document.getElementById('healthList').innerHTML = html;
        document.getElementById('stat-health').innerHTML = `<span style="color:var(--success)">${healthy}</span><span class="muted" style="font-size:20px">/${Object.keys(health.services).length}</span>`;
    } else {
        document.getElementById('healthList').innerHTML = '<p class="muted">Cannot reach health endpoint</p>';
    }

    document.getElementById('platformInfo').innerHTML = `
        <table>
        <tr><td class="muted">Version</td><td>${escapeHtml(health?.version || '--')}</td></tr>
        <tr><td class="muted">Tenant</td><td>${escapeHtml(currentUser?.tenant?.name || '--')}</td></tr>
        <tr><td class="muted">Role</td><td><span class="badge badge-blue">${escapeHtml(currentUser?.role?.name || '--')}</span></td></tr>
        <tr><td class="muted">Permissions</td><td>${currentUser?.role?.permissions?.length || 0} granted</td></tr>
        <tr><td class="muted">User ID</td><td style="font-size:12px;font-family:monospace">${escapeHtml(currentUser?.user_id?.substring(0,8) || '--')}...</td></tr>
        </table>`;

    const audit = await apiGet('/audit');
    if (audit === null) {
        document.getElementById('auditList').innerHTML = '<p role="alert">Unable to verify audit events. Refresh or check your access.</p>';
        return;
    }
    if (audit && audit.length > 0) {
        let html = '<table><tr><th>Action</th><th>Time</th><th>Detail</th></tr>';
        audit.slice(0,10).forEach(e => {
            html += `<tr><td>${escapeHtml(e.action)}</td><td class="muted">${new Date(e.created_at).toLocaleString()}</td><td class="muted" style="max-width:300px;overflow:hidden;text-overflow:ellipsis">${escapeHtml(JSON.stringify(e.detail||{}).substring(0,60))}</td></tr>`;
        });
        html += '</table>';
        document.getElementById('auditList').innerHTML = html;
    } else {
        document.getElementById('auditList').innerHTML = '<p class="muted">No audit events recorded yet.</p>';
    }
}

async function loadFindings() {
    const findings = await apiGet('/findings');
    if (findings === null) {
        document.getElementById('findingsList').innerHTML = '<p role="alert">Unable to verify findings. Refresh or check your access.</p>';
        document.getElementById('stat-findings').textContent = 'Unavailable';
        return;
    }
    if (findings && findings.length > 0) {
        let html = '<table><tr><th>Severity</th><th>Title</th><th>Source</th><th>Status</th><th>Created</th></tr>';
        findings.slice(0,25).forEach(f => {
            const sevClass = f.severity === 'critical' ? 'sev-c' : f.severity === 'high' ? 'sev-h' : f.severity === 'medium' ? 'sev-m' : 'sev-l';
            html += `<tr><td class="${sevClass}" style="font-weight:600;text-transform:uppercase">${escapeHtml(f.severity)}</td><td>${escapeHtml(f.title)}</td><td class="muted">${escapeHtml(f.source)}</td><td><span class="badge ${f.status==='open'?'badge-red':'badge-green'}">${escapeHtml(f.status)}</span></td><td class="muted">${new Date(f.created_at).toLocaleDateString()}</td></tr>`;
        });
        html += '</table>';
        document.getElementById('findingsList').innerHTML = html;
        document.getElementById('stat-findings').textContent = findings.length;
    } else {
        document.getElementById('findingsList').innerHTML = '<p class="muted">No findings recorded. Run a scan to generate findings.</p>';
        document.getElementById('stat-findings').textContent = '0';
    }
}

async function loadIncidents() {
    const incidents = await apiGet('/incidents');
    if (incidents === null) {
        document.getElementById('incidentsList').innerHTML = '<p role="alert">Unable to verify incident status. Refresh or check your access.</p>';
        document.getElementById('stat-incidents').textContent = 'Unavailable';
        return;
    }
    if (incidents && incidents.length > 0) {
        let html = '<table><tr><th>Severity</th><th>Title</th><th>Status</th><th>Created</th></tr>';
        incidents.slice(0,25).forEach(i => {
            const sevClass = i.severity === 'critical' ? 'sev-c' : i.severity === 'high' ? 'sev-h' : 'sev-m';
            html += `<tr><td class="${sevClass}" style="font-weight:600;text-transform:uppercase">${escapeHtml(i.severity)}</td><td>${escapeHtml(i.title)}</td><td><span class="badge ${i.status==='open'?'badge-red':'badge-green'}">${escapeHtml(i.status)}</span></td><td class="muted">${new Date(i.created_at).toLocaleDateString()}</td></tr>`;
        });
        html += '</table>';
        document.getElementById('incidentsList').innerHTML = html;
        document.getElementById('stat-incidents').textContent = incidents.length;
    } else {
        document.getElementById('incidentsList').innerHTML = '<p class="muted">No active incidents. All clear.</p>';
        document.getElementById('stat-incidents').textContent = '0';
    }
}

async function loadCloud() {
    const envs = await apiGet('/cloud/environments');
    if (envs === null) {
        document.getElementById('cloudList').innerHTML = '<p role="alert">Unable to verify cloud environments. Refresh or check your access.</p>';
        return;
    }
    if (envs && envs.length > 0) {
        let html = '<table><tr><th>Provider</th><th>Name</th><th>Status</th><th>Assets</th></tr>';
        envs.slice(0,15).forEach(e => {
            html += `<tr><td><span class="badge badge-blue">${escapeHtml(e.provider)}</span></td><td>${escapeHtml(e.name)}</td><td><span class="badge ${e.status==='active'?'badge-green':'badge-yellow'}">${escapeHtml(e.status)}</span></td><td class="muted">${escapeHtml(e.asset_count||0)}</td></tr>`;
        });
        html += '</table>';
        document.getElementById('cloudList').innerHTML = html;
    } else {
        document.getElementById('cloudList').innerHTML = '<p class="muted">No cloud environments registered. Use the API to register an AWS/Azure/GCP account.</p>';
    }

    const ciem = await apiGet('/ciem/findings');
    if (ciem === null) {
        document.getElementById('ciemList').innerHTML = '<p role="alert">Unable to verify cloud identity findings. Refresh or check your access.</p>';
        return;
    }
    if (ciem && ciem.length > 0) {
        let html = '<table><tr><th>Severity</th><th>Identity</th><th>Type</th><th>Issue</th></tr>';
        ciem.slice(0,15).forEach(f => {
            const sevClass = f.severity === 'critical' ? 'sev-c' : f.severity === 'high' ? 'sev-h' : 'sev-m';
            html += `<tr><td class="${sevClass}">${escapeHtml(f.severity)}</td><td>${escapeHtml(f.identity_name)}</td><td class="muted">${escapeHtml(f.identity_type)}</td><td>${escapeHtml(f.title)}</td></tr>`;
        });
        html += '</table>';
        document.getElementById('ciemList').innerHTML = html;
    } else {
        document.getElementById('ciemList').innerHTML = '<p class="muted">No CIEM findings. Run a CIEM scan to analyze cloud identities.</p>';
    }
}

function escapeHtml(value) {
  return String(value ?? '').replace(/[&<>"']/g, character => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  }[character]));
}
async function loadAgents() {
  const container = document.getElementById('agentsList');
  container.setAttribute('aria-live', 'polite');
  container.setAttribute('aria-busy', 'true');
  container.innerHTML = '<p role="status">Verifying the agent registry and mission activity...</p>';
  try {
    const responses = await Promise.all(['/agents', '/agents/activity', '/agents/planned'].map(path =>
      fetch(API + path, {credentials: 'include', cache: 'no-store'})));
    if (responses.some(response => response.status === 401)) {
      container.innerHTML = '<p role="alert">Your session has expired. Sign in again to verify agent activity.</p>';
      return;
    }
    if (responses.some(response => !response.ok)) throw new Error('Registry unavailable');
    const [agents, activity, planned] = await Promise.all(responses.map(response => response.json()));
    if (![agents, activity, planned].every(Array.isArray)) throw new Error('Unexpected response');
    const busy = new Set(activity.map(task => task.agent_name));
    const operational = agents.filter(agent => String(agent.status).toUpperCase() === 'OPERATIONAL').length;
    const degraded = agents.filter(agent => String(agent.status).toUpperCase() === 'DEGRADED').length;
    const stamp = new Date().toLocaleTimeString();
    const rows = agents.map(agent => {
      const name = agent.name;
      const status = String(agent.status || 'UNKNOWN').toUpperCase();
      const executing = busy.has(name);
      const tools = Array.isArray(agent.tool_names) ? agent.tool_names.join(', ') : '';
      return '<tr><th scope="row">' + escapeHtml(agent.display_name || name) +
        '</th><td><span class="assurance-pill ' + (status === 'OPERATIONAL' ? 'ok' : 'warn') + '">' +
        escapeHtml(status) + '</span></td><td>' + (executing ? 'Executing a mission' : 'No running mission recorded') +
        '</td><td>' + escapeHtml(agent.department || agent.team || '') +
        '</td><td>' + escapeHtml(tools || 'See agent details') + '</td></tr>';
    }).join('');
    const plannedNames = planned.map(agent => '<li>' + escapeHtml(agent.display_name || agent.name) + '</li>').join('');
    container.innerHTML = '<section class="assurance-panel" aria-labelledby="assurance-title">' +
      '<div class="assurance-heading"><div><p class="assurance-eyebrow">GDS / VERIFIED OPERATIONS</p>' +
      '<h2 id="assurance-title">Agent Assurance</h2></div><button type="button" class="btn btn-primary" onclick="loadAgents()">Refresh evidence</button></div>' +
      '<p class="muted">Registry status and live mission activity are separate signals. Operational does not mean busy or independently certified healthy.</p>' +
      '<div class="assurance-metrics"><div><strong>' + agents.length + '</strong><span>Registered</span></div>' +
      '<div><strong>' + operational + '</strong><span>Marked operational</span></div>' +
      '<div><strong>' + degraded + '</strong><span>Degraded</span></div>' +
      '<div><strong>' + busy.size + '</strong><span>Executing missions</span></div>' +
      '<div><strong>' + planned.length + '</strong><span>Planned</span></div></div>' +
      '<p class="muted">Checked at ' + escapeHtml(stamp) + '. Activity is limited to your organisation and reflects recorded running tasks.</p>' +
      '<div class="assurance-table" role="region" aria-label="Agent status and capabilities" tabindex="0"><table><thead><tr><th scope="col">Agent</th>' +
      '<th scope="col">Registry status</th><th scope="col">Mission activity</th><th scope="col">Department</th><th scope="col">Tools</th></tr></thead>' +
      '<tbody>' + (rows || '<tr><td colspan="5">No registered agents returned.</td></tr>') + '</tbody></table></div>' +
      '<details class="assurance-planned"><summary>' + planned.length + ' planned capabilities — not operational agents</summary><ul>' +
      plannedNames + '</ul></details></section>';
  } catch (_) {
    container.innerHTML = '<div role="alert" class="assurance-panel"><h2>Agent status unavailable</h2>' +
      '<p>GDS could not verify registry and activity data. No active-agent count is being assumed.</p>' +
      '<button type="button" class="btn btn-primary" onclick="loadAgents()">Retry verification</button></div>';
  } finally {
    container.setAttribute('aria-busy', 'false');
  }
}
</script>
</body>
</html>
